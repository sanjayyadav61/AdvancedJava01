# ShopSphere Database Configuration
# Primary: MySQL 8.0+
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/shopsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
# Database Credentials (hidden for security - can be set via env var SHOPSPHERE_DB_PASSWORD or DB_PASSWORD)
db.username=root
db.password=


# Fallback: In-memory / Embedded H2 Database (Auto-fallback if MySQL connection fails)
db.fallback.enabled=true
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:mem:shopsphere;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
db.fallback.username=sa
db.fallback.password=
